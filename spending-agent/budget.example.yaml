# Copy this file to budget.yaml and edit it. Gitignored - it's your personal
# budget numbers, not something to commit.
#
# monthly_budget maps a category id (from rules.yaml's `categories:` list -
# the `id:` field, not the display `name:`) to a monthly dollar amount.
#
# Any category you don't list here just has no budget - it renders with no
# target line, same as before this feature existed. Any category you do list
# gets a status color on the Fixed Costs / Guilt-Free Spending charts:
#   green  = under 90% of budget
#   amber  = 90-100% of budget
#   red    = over budget
#
# See rules.yaml for the full list of category ids.

