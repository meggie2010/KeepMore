# Copy this file to report_config.yaml and edit it. Gitignored - it's your
# personal payroll figures, not something to commit.
#
# Money that never touches your checking/credit accounts (pre-tax payroll
# deductions like 401k and HSA) can't be detected from bank CSVs - there's
# no transaction for it. List it here and the report adds it on top of the
# transaction-derived Investments total, and adds it back into Total Take
# Home Pay too (since it's real income, just redirected before you see it).
#
# `investments` is a flat {label: amount} dict - applied every month.
#
# `income` is a list, for income that doesn't apply to your whole history
# (e.g. a rental property you didn't always have). Each entry needs
# `amount`; `start_month` (YYYY-MM) is optional - omit it to apply every
# month, like investments.
#
# Leave monthly_additions empty ({}) if none of this applies to you.

monthly_additions:
  investments:
    "401k": 1172.00
    "HSA": 671.00
  income:
    - label: "Rental - tenants"
      amount: 2050.00
      start_month: "2026-06"
