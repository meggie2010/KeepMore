  # --- Investments (its own report line, not spending) ---
  - id: investments
    name: Investments
    group: investments
    keywords:
      - vanguard buy
      - "vgi 529"
      # note: "vanguard sell" isn't listed here — the one sell in the data
      # (4/15/2026, $12,807.58) was part of the home purchase and is
      # excluded below with the rest of that cluster. If you have a
      # genuinely unrelated Vanguard sell in the future, add "vanguard
      # sell" back here (or a more specific keyword for it).

  # --- Transfers (fully excluded — not shown anywhere in the report;
  # money moving to pay off a card whose purchases aren't itemized here) ---
  - id: transfer
    name: Transfers & Payments
    group: transfer
    keywords:
      - chase credit crd autopay
      - chase credit card autopay
      - automatic payment - thank
      - online payment thank you
      - transfer to
      - transfer from
      - atm withdrawal
      - zelle payment
      # These cards are paid off via ACH but not yet ingested itemized —
      # excluded here to avoid double-counting once they're added; until
      # then, spending on them isn't reflected in this report at all.
      - american express ach
      - bk of amer mc
      - bank of america payment
      # one-time home purchase / closing costs — ignored entirely (not
      # shown as spending, savings, or investments), too large a one-time
      # event to be meaningful in a monthly report
      - bridge city title
      - goldman sachs
      - beacon electrica
      - earnnest
      - vanguard sell
      - "check 137"
      - "check 107"
      - "check 127"

# Fallback when no keyword above matches — uses the bank's own category
# (from accounts.yaml's category_column), if the account provides one.
source_category_fallback:
  "Bills & Utilities": bills_utilities
  "Home": home_projects
  "Shopping": shopping
  "Groceries": groceries
  "Automotive": auto
  "Gas": auto
  "Travel": travel_vacation
  "Entertainment": entertainment_rec
  "Health & Wellness": health_wellness
  "Personal": personal
  "Professional Services": home_projects
  "Food & Drink": dining
  "Fees & Adjustments": fees
