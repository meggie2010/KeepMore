# Editable categorization rules. Each category has a keyword list — a
# transaction is matched to the first category whose keyword appears
# (case-insensitive, substring match) in its description. Order matters:
# put more specific categories above more general ones.
#
# If nothing matches, `source_category_fallback` maps your bank's own
# category (captured from accounts.yaml's `category_column`, if set) to one
# of these categories. If that doesn't match either, it falls to `other`.
#
# `group` is one of: fixed | guiltfree | income | transfer
#   - fixed / guiltfree feed the Fixed Costs vs. Guilt-Free Spending split
#   - income feeds the savings-rate calculation
#   - transfer is excluded entirely (credit card payments, investment
#     buys/sells, savings contributions — money moving between your own
#     accounts, not being earned or spent)

groups:
  fixed: Fixed Costs
  guiltfree: Guilt-Free Spending
  income: Income
  transfer: Transfers (excluded)

categories:
  # --- Fixed Costs ---
  - id: housing
    name: Housing
    group: fixed
    keywords: [rent, mortgage, "hoa "]

  - id: utilities
    name: Utilities
    group: fixed
    keywords:
      - epb electric
      - epb fiber
      - republic services trash
      - waldens ridge utility
      - water bill
      - sewer
      - comcast
      - xfinity
      - spectrum
      - "at&t"
      - att* bill payment
      - verizon
      - t-mobile
      - mtg pymts

  - id: insurance
